<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Shadows &amp; Depth</h1>
        <p>Three cards with different shadow styles.</p>
    </header>

    <main class="card-container">
        <article class="profile-card soft-shadow">
            <div class="avatar">AK</div>
            <h2>Aarav Kumar</h2>
            <p>UI Designer</p>
            <span>Soft shadow</span>
        </article>

        <article class="profile-card sharp-shadow">
            <div class="avatar">NS</div>
            <h2>Neha Sharma</h2>
            <p>Frontend Developer</p>
            <span>Sharp shadow</span>
        </article>

        <article class="profile-card deep-shadow">
            <div class="avatar">RM</div>
            <h2>Rohan Mehta</h2>
            <p>Product Manager</p>
            <span>Deep shadow</span>
        </article>
    </main>
</body>
</html>
