<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="fixed-header">
        <h1>Gradient Showcase</h1>
    </header>

    <main>
        <section class="gradient-section linear">
            <div class="content">
                <h2>Linear Gradient</h2>
                <p>
                    This section uses a linear-gradient that changes smoothly
                    across the background.
                </p>
            </div>
        </section>

        <section class="gradient-section radial">
            <div class="content">
                <h2>Radial Gradient</h2>
                <p>
                    This section uses a radial-gradient that spreads outward
                    from a central point.
                </p>
            </div>
        </section>
    </main>

    <footer class="fixed-footer">
        <p>&copy; 2026 Gradient Practice Page</p>
    </footer>
</body>
</html>
