<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Borders &amp; Padding</h1>
        <p>Different border styles, rounded corners, and internal spacing.</p>
    </header>

    <main>
        <section class="box-container" aria-label="Border and padding examples">
            <article class="demo-box solid">
                <h2>Solid Border</h2>
                <p>Padding: 20px</p>
            </article>

            <article class="demo-box dashed">
                <h2>Dashed Border</h2>
                <p>Padding: 30px</p>
            </article>

            <article class="demo-box double">
                <h2>Double Border</h2>
                <p>Padding: 15px</p>
            </article>

            <article class="demo-box groove">
                <h2>Groove Border</h2>
                <p>Padding: 40px</p>
            </article>

            <article class="demo-box rounded">
                <h2>Rounded Corners</h2>
                <p>border-radius: 25px</p>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CSS Practice</p>
    </footer>
</body>
</html>
