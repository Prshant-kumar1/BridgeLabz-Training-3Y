<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>CSS Bootstrap</title>
</head>
<body>
    <div class="container bg-danger text-white p-5 mt-5 text primary w-100 vh-100 text-center d-flex justify-content-center align-items-center flex-column">    
        <i class="bi bi-apple fs-1"></i>
        <h1>Hello world!!!</h1>
        <p>This is a paragraph inside the container.</p>
    </div>

    <div class="row">
        <div class="col-sm-3 bg-primary text-white p-5">
            <h2>Column 1</h2>
            <p>This is the first column.</p>
        </div>
        <div class="col-sm-3 bg-secondary text-white p-5">
            <h2>Column 2</h2>
            <p>This is the second column.</p>
        </div>
        <div class="col-sm-6 bg-success text-white p-5">
            <h2>Column 3</h2>
            <p>This is the third column.</p>
        </div>
        <div class="col-sm-1 bg-info text-white p-5">
            <h2>Column 4</h2>
            <p>This is the fourth column.</p>
        </div>
    </div>
</body>
</html>
