<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive image gallery demonstrating CSS filters and hover transitions.">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header class="page-header">
        <p class="eyebrow">CSS Practice · Question 1</p>
        <h1>Image Filter Gallery</h1>
        <p class="intro">Explore six CSS filters. Hover over an image to reveal its original colors.</p>
    </header>

    <main>
        <section class="gallery" aria-label="Gallery of images with CSS filters">
            <figure class="gallery-item">
                <img class="filter-blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape under a wide sky">
                <figcaption><span>01</span> Blur</figcaption>
            </figure>
            <figure class="gallery-item">
                <img class="filter-grayscale" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Mountain reflected in a calm lake">
                <figcaption><span>02</span> Grayscale</figcaption>
            </figure>
            <figure class="gallery-item">
                <img class="filter-sepia" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Green valley surrounded by mountains">
                <figcaption><span>03</span> Sepia</figcaption>
            </figure>
            <figure class="gallery-item">
                <img class="filter-brightness" src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=900&q=80" alt="Ocean waves rolling onto a shore">
                <figcaption><span>04</span> Brightness</figcaption>
            </figure>
            <figure class="gallery-item">
                <img class="filter-contrast" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Sunlight breaking over a green field">
                <figcaption><span>05</span> Contrast</figcaption>
            </figure>
            <figure class="gallery-item">
                <img class="filter-hue" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Scenic open landscape with distant mountains">
                <figcaption><span>06</span> Hue rotate</figcaption>
            </figure>
        </section>
    </main>

    <footer class="page-footer">
        <p>Built with HTML5 and CSS Grid · No JavaScript</p>
    </footer>
</body>
</html>
