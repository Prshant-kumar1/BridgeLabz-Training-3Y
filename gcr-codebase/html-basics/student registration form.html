<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h2 align="center">Student Registration Form</h2>

    <form>
        <table border="1" align="center" cellpadding="10" cellspacing="0" width="700">
            <tr>
                <th colspan="2">Registration Form</th>
            </tr>
            <tr>
                <td width="30%" for="fullName">Full Name</td>
                <td><input type="text" name="fullName" id="fullName" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td for="email">Email</td>
                <td><input type="email" name="email" id="email" placeholder="abc@gmail.com"></td>
            </tr>
            <tr>
                <td for="phone">Phone Number</td>
                <td><input type="tel" name="phone" id="phone" placeholder="9876543210"></td>
            </tr>
            <tr>
                <td for="dob">Date of Birth</td>
                <td><input type="date" name="dob" id="dob"></td>
            </tr>
            <tr>
                <td for="gender">Gender</td>
                <td>
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label> 
                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label> 
                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                </td>
            </tr>
            <tr>
                <td for="skills">Skills</td>
                <td>
                    <input type="checkbox" id="html" name="skills" value="HTML">
                    <label for="html">HTML</label> 
                    <input type="checkbox" id="css" name="skills" value="CSS">
                    <label for="css">CSS</label> 
                    <input type="checkbox" id="javascript" name="skills" value="JavaScript">
                    <label for="javascript">JavaScript</label>
                </td>
            </tr>
            <tr>
                <td for="course">Course</td>
                <td>
                    <select name="course" id="course">
                        <option value="">--Select Course--</option>
                        <option value="webDevelopment">Web Development</option>
                        <option value="dataScience">Data Science</option>
                        <option value="machineLearning">Machine Learning</option>
                        <optgroup label="Mobile Development">
                            <option value="androidDevelopment">Android Development</option>
                            <option value="iosDevelopment">iOS Development</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td for="address">Address</td>
                <td>
                    <textarea name="address" id="address" rows="4" cols="35"></textarea>
                </td>
            </tr>
            <tr>
                <td for="resume">Upload Resume</td>
                <td><input type="file" name="resume" id="resume"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
