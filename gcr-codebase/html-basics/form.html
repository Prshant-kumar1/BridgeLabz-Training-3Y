<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>INFO Form</h1>
    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" placeholder="Enter your name" name="name"><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="Enter your email" name="email"><br>
         
        <label for="pass">Password:</label><br>
        <input type="password" id="pass" placeholder="Enter your password" name="pass"><br>

        <label for="phone">Phone:</label><br>
        <input type="tel" id="phone" placeholder="Enter your phone number" name="phone">

        <label for="date">Date:</label>
        <input type="date" id="date" name="date"><br>
        <br>

        <label>skills:</label><br>
        <select name="skill">
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
        </select>

        <selection>
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>
            <input type="checkbox" id="javascript" name="skills" value="JavaScript">
            <label for="javascript">JavaScript</label>
        </selection>

        <br>
        <br>

        <selection>
            <label for="gender">Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </selection>
        <br><br>
        <input type="file" id="file" name="file"><br><br>
        <input type="range" id="range" name="range" min="0" max="3"><br><br>

        <textarea id="message" name="message" rows="4" cols="50" placeholder="Enter your message"></textarea><br><br>
        <br><br>
        <button type="submit">Submit</button>

    </form>
</body>
</html>
