<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Inline Formatting</title>
</head>
<body>
    <p>
        <strong>Keep learning</strong> and
        <em>keep building</em> your skills.
        <mark>Practice matters!</mark>
        <small>One step at a time.</small>
        <br>
        Every project is an opportunity to improve.
    </p>
</body>
</html>
