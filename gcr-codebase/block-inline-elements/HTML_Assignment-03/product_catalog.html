<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
</head>
<body>

    <h1>Online Store Product Catalog</h1>

    <table border="1">

        <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td><img src="laptop.jpg" alt="Laptop" width="100"></td>
            <td>Laptop</td>
            <td>15.6-inch Full HD Laptop</td>
            <td>₹55,000</td>
            <td rowspan="2">In Stock</td>
        </tr>

        <tr>
            <td><img src="phone.jpg" alt="Phone" width="100"></td>
            <td>Smartphone</td>
            <td>5G Android Smartphone</td>
            <td>₹25,000</td>
        </tr>

        <tr>
            <td><img src="headphone.jpg" alt="Headphones" width="100"></td>
            <td colspan="2">
                Wireless Headphones - Noise Cancelling
            </td>
            <td>₹3,000</td>
            <td>Out of Stock</td>
        </tr>

    </table>

</body>
</html>
