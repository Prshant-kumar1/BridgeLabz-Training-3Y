<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Step Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { max-width: 400px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .step { display: none; }
        .step.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: red; font-size: 12px; margin-top: 4px; display: block; }
        .buttons { margin-top: 15px; display: flex; justify-content: space-between; }
        button { padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
<div class="form-container">
    <form id="multiStepForm">
        <div class="step active" data-step="1">
            <h3>Step 1 of 3: Personal Info</h3>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
                <span class="error" id="nameError"></span>
            </div>
        </div>
        <div class="step" data-step="2">
            <h3>Step 2 of 3: Contact Info</h3>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@domain.com">
                <span class="error" id="emailError"></span>
            </div>
        </div>
        <div class="step" data-step="3">
            <h3>Step 3 of 3: Security</h3>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min 6 characters">
                <span class="error" id="passwordError"></span>
            </div>
        </div>
        <div class="step" data-step="4">
            <h3>Summary & Confirmation</h3>
            <div id="summaryContent"></div>
        </div>
        <div class="buttons">
            <button type="button" id="backBtn" style="display: none;">Back</button>
            <button type="button" id="nextBtn">Next</button>
        </div>
    </form>
</div>
<script src="q3_multi_step_form.js"></script>
</body>
</html>
