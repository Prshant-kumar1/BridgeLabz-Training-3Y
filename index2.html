<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
</head>
<body>
    <h1 id="heading">Count: 0</h1>
    <button id="incrementBtn">Increment</button>
    <button id="decrementBtn">Decrement</button>
    <button id="resetBtn">Reset</button>

    <button id="toggleBtn">Toggle</button>

</body>



<script>
    const headingEl = document.getElementById('heading');
    const incrementBtn = document.getElementById('incrementBtn');
    const decrementBtn = document.getElementById('decrementBtn');
    const resetBtn = document.getElementById('resetBtn');

    const toggelEl = document.getElementById('toggleBtn');

    let count = 0;

    incrementBtn.addEventListener('click', () => {
        count++;
        headingEl.textContent = `Count: ${count}`;

        if(count > 0) {
            headingEl.style.color = 'green';
        } else {
            headingEl.style.color = 'red';
        }
    });

    decrementBtn.addEventListener('click', () => {
        count--;
        headingEl.textContent = `Count: ${count}`;

        if(count > 0) {
            headingEl.style.color = 'green';
        } else {
            headingEl.style.color = 'red';
        }
    });
    

    resetBtn.addEventListener('click', () => {
        count = 0;
        headingEl.textContent = `Count: ${count}`;
    });


    toggelEl.addEventListener('click', () => {
        if(headingEl.style.display === 'none') {
            headingEl.style.display = 'block';
        } else {
            headingEl.style.display = 'none';
        }
    });

</script>>
</html>
