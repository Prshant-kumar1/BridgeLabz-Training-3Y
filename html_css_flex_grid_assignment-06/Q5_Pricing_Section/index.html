<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pricing-page">
        <section class="pricing-header">
            <p class="eyebrow">Simple pricing</p>
            <h1>Choose Your Plan</h1>
            <p>Flexible plans for students, creators, and growing teams.</p>
        </section>

        <section class="pricing-container" aria-label="Pricing plans">
            <article class="pricing-card">
                <h2>Basic</h2>
                <p class="description">For getting started.</p>
                <p class="price">₹499<span>/month</span></p>
                <a href="#">Choose Plan</a>
            </article>

            <article class="pricing-card featured">
                <p class="popular">Most Popular</p>
                <h2>Pro</h2>
                <p class="description">For serious builders.</p>
                <p class="price">₹999<span>/month</span></p>
                <a href="#">Choose Plan</a>
            </article>

            <article class="pricing-card">
                <h2>Premium</h2>
                <p class="description">For growing teams.</p>
                <p class="price">₹1,999<span>/month</span></p>
                <a href="#">Choose Plan</a>
            </article>
        </section>
    </main>
</body>
</html>
