<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <h1>Dashboard</h1>
            <p>Overview of your workspace</p>
        </header>

        <aside class="sidebar">
            <nav aria-label="Dashboard navigation">
                <a href="#">Overview</a>
                <a href="#">Analytics</a>
                <a href="#">Projects</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <section class="dashboard-box box-large">
                <h2>Performance</h2>
                <p>Overall performance is improving steadily this month.</p>
            </section>

            <section class="dashboard-box">
                <h2>Users</h2>
                <p>2,450 active users.</p>
            </section>

            <section class="dashboard-box">
                <h2>Revenue</h2>
                <p>₹1,25,000 generated this month.</p>
            </section>
        </main>
    </div>
</body>
</html>
