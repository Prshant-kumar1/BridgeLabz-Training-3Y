<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header>
        <h1>Creative Image Showcase</h1>
    </header>
    
    <main>
        <section class="gallery-grid">
            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1015/600/400" alt="Landscape 1">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain View</figcaption>
            </figure>
            
            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1016/600/400" alt="Landscape 2">
                    <div class="overlay"></div>
                </div>
                <figcaption>Canyon Horizon</figcaption>
            </figure>

            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1018/600/400" alt="Landscape 3">
                    <div class="overlay"></div>
                </div>
                <figcaption>Nature Trails</figcaption>
            </figure>

            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1019/600/400" alt="Landscape 4">
                    <div class="overlay"></div>
                </div>
                <figcaption>Coastal Line</figcaption>
            </figure>

            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1020/600/400" alt="Landscape 5">
                    <div class="overlay"></div>
                </div>
                <figcaption>Wildlife Reserve</figcaption>
            </figure>

            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1021/600/400" alt="Landscape 6">
                    <div class="overlay"></div>
                </div>
                <figcaption>Forest Canopy</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
