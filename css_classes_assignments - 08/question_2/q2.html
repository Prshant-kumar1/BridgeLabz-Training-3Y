<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>
    <main class="tooltip-container">
        <div class="tooltip-wrapper">
            <span class="icon">ℹ️</span>
            <div class="tooltip">This is an information icon!</div>
        </div>
        
        <div class="tooltip-wrapper">
            <span class="text-trigger">Hover this word</span>
            <div class="tooltip">You revealed the hidden tooltip text.</div>
        </div>
        
        <div class="tooltip-wrapper">
            <button class="action-btn">Hover Button</button>
            <div class="tooltip">Clicking does nothing, but hovering is fun.</div>
        </div>
    </main>
</body>
</html>
